services:
  - type: web
    name: store-display-inspector
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: VISION_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: VISION_MODEL
        value: glm-4v-flash
